<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نرخی دۆلار بە دینار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e5ece6;--surface:#f6f9f5;--ink:#0e2822;--mute:#5a6f68;--line:#cbd7cd;
  --note1:#1b5144;--note2:#0d2b25;--gold:#e8b730;--gold-ink:#8a6410;
  --up:#17814f;--down:#c23b3b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09130f;--surface:#101e1a;--ink:#e6efe8;--mute:#8aa399;--line:#223a33;
  --note1:#1b5144;--note2:#0a211c;--gold:#f0c24a;--gold-ink:#f0c24a;--up:#58d69b;--down:#ff8a84;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09130f;--surface:#101e1a;--ink:#e6efe8;--mute:#8aa399;--line:#223a33;
  --note1:#1b5144;--note2:#0a211c;--gold:#f0c24a;--gold-ink:#f0c24a;--up:#58d69b;--down:#ff8a84;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",system-ui,sans-serif;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 70px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.sun{width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--gold)}
h1{font-size:1.15rem;margin:0;font-weight:800}
.tools{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--mute);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:1rem;line-height:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.banknote{position:relative;overflow:hidden;border-radius:20px;padding:22px 22px 24px;color:#f3f7f2;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 7px),
    linear-gradient(135deg,var(--note1),var(--note2));
  box-shadow:0 0 0 1px rgba(232,183,48,.55) inset,0 0 0 6px rgba(0,0,0,.18) inset,0 14px 30px -14px rgba(8,30,24,.55)}
.rosette{position:absolute;left:-70px;bottom:-100px;width:300px;height:300px;pointer-events:none}
.rosette ellipse{fill:none;stroke:rgba(255,255,255,.1);stroke-width:.7}
.corner{position:absolute;top:14px;left:20px;font-weight:800;font-size:.95rem;color:var(--gold);opacity:.9}
.cap{margin:0;font-size:.95rem;opacity:.8;position:relative}
.amount{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px;position:relative;direction:rtl}
.price{font-size:clamp(3rem,15.5vw,4.9rem);font-weight:900;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr}
.unit{font-size:1.1rem;font-weight:600;color:var(--gold)}
.delta{margin:10px 0 0;font-size:.9rem;font-weight:600;min-height:1.4em;position:relative}
.delta.up{color:#7ae3b0}.delta.down{color:#ffa29c}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:14px;padding:16px 18px}
.card h2{margin:0 0 12px;font-size:.95rem;font-weight:800;color:var(--gold-ink)}
.split{display:grid;grid-template-columns:1fr 1fr}
.split>div+div{border-right:1px solid var(--line);padding-right:18px}
.split>div:first-child{padding-left:18px}
.k{margin:0;font-size:.82rem;color:var(--mute)}
.v{margin:0;font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.spread{margin:12px 0 0;font-size:.82rem;color:var(--mute)}

.conv{display:grid;gap:10px}
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--bg)}
.field label{font-size:.85rem;color:var(--mute);min-width:44px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;font-weight:800;text-align:left;direction:ltr;padding:6px 0;font-variant-numeric:tabular-nums}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--gold)}

.credit{text-align:center;margin:34px 0 0;font-weight:600;font-size:.95rem;color:var(--gold-ink)}
.credit::before{content:"";display:block;width:36px;height:2px;background:var(--gold);margin:0 auto 12px;border-radius:2px}
.hide{display:none}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><span class="sun" aria-hidden="true"></span><h1>نرخی دۆلار</h1></div>
    <div class="tools">
      <span class="pill"><i class="dot"></i><span id="clock">...</span></span>
      <button id="theme" type="button" aria-label="گۆڕینی ڕووناک و تاریک">◐</button>
    </div>
  </header>

  <section class="banknote" aria-live="polite">
    <svg class="rosette" id="rosette" viewBox="-150 -150 300 300" aria-hidden="true"></svg>
    <span class="corner">$١٠٠</span>
    <p class="cap">١٠٠ دۆلار بە دینار</p>
    <div class="amount"><span class="price" id="price">–</span><span class="unit">دینار</span></div>
    <p class="delta" id="delta"></p>
  </section>

  <section class="card" id="sulyCard">
    <h2>سلێمانی</h2>
    <div class="split">
      <div><p class="k">فرۆشتن</p><p class="v" id="sell">–</p></div>
      <div><p class="k">کڕین</p><p class="v" id="buy">–</p></div>
    </div>
    <p class="spread" id="spread"></p>
  </section>

  <section class="card">
    <h2>گۆڕینی دراو</h2>
    <div class="conv">
      <div class="field"><label for="usd">دۆلار</label><input id="usd" inputmode="decimal" autocomplete="off" value="١٠٠"></div>
      <div class="field"><label for="iqd">دینار</label><input id="iqd" inputmode="decimal" autocomplete="off"></div>
    </div>
  </section>

  <p class="credit">دروستکراوە لەلایەن (شکۆ ڕەزگەیی)</p>
</main>

<script>
const API = 'https://rates.shkorazgay.workers.dev';
const $ = id => document.getElementById(id);
const kd = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const en = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,،٬\s]/g, '').replace('٫', '.');
const fmt = n => kd(Math.round(n).toLocaleString('en-US'));
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

// نەخشی بانکنۆت
(function(){ let h=''; for (let i=0;i<48;i++) h += `<ellipse rx="140" ry="46" transform="rotate(${i*3.75})"/>`; $('rosette').innerHTML = h; })();

let shown = null, rate = 0;
function roll(el, to){
  if (reduce) { el.textContent = fmt(to); shown = to; return; }
  const from = shown ?? Math.round(to * 0.8), t0 = performance.now(), dur = 900;
  (function step(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step); else shown = to;
  })(t0);
}

function trackDelta(v){
  try {
    const s = JSON.parse(localStorage.getItem('prevRate') || 'null');
    if (!s) { localStorage.setItem('prevRate', JSON.stringify({ v })); return null; }
    if (s.v !== v) { const o = { v, d: v - s.v }; localStorage.setItem('prevRate', JSON.stringify(o)); return o.d; }
    return s.d || null;
  } catch (e) { return null; }
}

function convert(){
  const v = parseFloat(en($('usd').value));
  $('iqd').value = isFinite(v) && rate ? fmt(v * rate / 100) : '';
}
$('usd').addEventListener('input', convert);
$('iqd').addEventListener('input', () => {
  const v = parseFloat(en($('iqd').value));
  $('usd').value = isFinite(v) && rate ? kd(+(v * 100 / rate).toFixed(2)) : '';
});

async function load(){
  let d;
  try {
    let r = null;
    if (API) { try { r = await fetch(API); if (!r.ok) r = null; } catch (e) { r = null; } }
    if (!r) r = await fetch('api/rates?t=' + Date.now());
    if (!r.ok) throw new Error('x');
    d = await r.json();
    if (!d.main) throw new Error('x');
  } catch (e) { if (!rate) $('clock').textContent = 'پەیوەندی نییە'; return; }

  rate = d.main;
  if (shown !== d.main) roll($('price'), d.main);
  const dl = trackDelta(d.main), el = $('delta');
  if (dl) { el.className = 'delta ' + (dl > 0 ? 'up' : 'down'); el.textContent = (dl > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(dl)) + ' لە گۆڕانکارییەکەی پێشوو'; }
  else { el.textContent = ''; el.className = 'delta'; }

  const has = d.sulaymaniyah || d.sulaymaniyahBuy;
  $('sulyCard').classList.toggle('hide', !has);
  $('sell').textContent = d.sulaymaniyah ? fmt(d.sulaymaniyah) : '–';
  $('buy').textContent = d.sulaymaniyahBuy ? fmt(d.sulaymaniyahBuy) : '–';
  $('spread').textContent = d.sulaymaniyah && d.sulaymaniyahBuy ? 'جیاوازی کڕین و فرۆشتن: ' + fmt(d.sulaymaniyah - d.sulaymaniyahBuy) : '';

  if (d.updatedAt) $('clock').textContent = 'نوێکراوەتەوە ' + kd(new Date(d.updatedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
  convert();
}
load(); setInterval(load, 15000);

$('theme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
});
</script>
</body>
</html>
